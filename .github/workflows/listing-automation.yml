name: PLX listing automation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Overlapping runs would race on the state commit-back below.
concurrency:
  group: listing-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gh ships with ubuntu-latest; only install if that ever changes.
      - name: Ensure gh
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gh
          fi
          gh --version

      - name: Run listing automation
        env:
          LISTING_AUTOMATION_ENABLED: "true"
          LISTING_QUEST_ENABLED: ${{ vars.LISTING_QUEST_ENABLED || 'true' }}
          LISTING_PR_NUDGE_ENABLED: "true"
          LISTING_RUN_BRANDING: "false"
          TOKEN_TELEGRAM_BOT: ${{ secrets.TOKEN_TELEGRAM_BOT }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          LISTING_QUEST_CHAT_ID: ${{ secrets.LISTING_QUEST_CHAT_ID }}
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/plx-listing-automation.py

      # The checkout is ephemeral, so interval throttling (quest, PR nudge,
      # summary, USD alert) only holds if state is committed back. Otherwise the
      # committed timestamps never advance and every run re-notifies.
      - name: Persist automation state
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(listing): persist automation state [skip ci]"
          # Schedules can overlap with human pushes; rebase instead of failing.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
