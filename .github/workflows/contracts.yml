name: Contracts CI

# Run lint, build, and test on every push and PR to master.
# This protects the master branch — broken code can never land
# without the maintainer noticing the red ❌ check on the PR.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Build · Test (60 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Acton version
        id: acton-version
        # Versi CLI dibaca dari Acton.toml, bukan "latest". Aktif `acton` menolak
        # jalan kalau versinya tidak sama dengan [toolchain].acton, jadi memasang
        # rilis terbaru (insiden 2026-09-24: latest = 1.2.0 sementara proyek
        # mem-pin 1.1.0) membuat seluruh job merah tanpa satu baris Tolk salah.
        run: |
          version=$(grep -m1 '^acton = ' Acton.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Tidak bisa membaca [toolchain].acton dari Acton.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Acton yang di-pin proyek: $version"

      - name: Cache Acton CLI
        id: cache-acton
        uses: actions/cache@v4
        with:
          path: ~/.acton
          key: acton-${{ runner.os }}-${{ steps.acton-version.outputs.version }}-v1

      - name: Install Acton CLI
        if: steps.cache-acton.outputs.cache-hit != 'true'
        run: curl -LsSf "https://github.com/ton-blockchain/acton/releases/download/v${{ steps.acton-version.outputs.version }}/acton-installer.sh" | sh

      - name: Add Acton to PATH
        run: echo "$HOME/.acton/bin" >> $GITHUB_PATH

      - name: Verify Acton install
        run: |
          acton --version
          expected="${{ steps.acton-version.outputs.version }}"
          installed=$(acton --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$installed" != "$expected" ]; then
            echo "Acton terpasang $installed, tapi proyek butuh $expected" >&2
            exit 1
          fi

      - name: Initialize project (download Tolk stdlib)
        run: acton init

      - name: Build contracts (pass 1 — generate @gen/*)
        # Pass 1 wajib boleh gagal: kontrak turunan meng-import @gen/<Dep>.code
        # yang baru lahir dari pass ini, dan gen/ di-gitignore, jadi checkout
        # bersih selalu mati dengan "Failed to import: No such file or directory".
        # Dua kunci `run:` di satu step (bug lama) membuat YAML menimpa pass
        # pertama sehingga gate build selalu merah.
        run: acton build
        continue-on-error: true

      - name: Build contracts (pass 2 — gate build sebenarnya)
        run: acton build

      - name: Lint (acton check)
        run: acton check
        continue-on-error: true

      - name: Format check (acton fmt --check)
        run: acton fmt --check
        continue-on-error: true

      - name: Run test suite (60 tests, real quality gate)
        run: acton test
